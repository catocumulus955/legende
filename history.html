<html lang="no">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Legendeløpet Historikk</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Lato&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />

    <style>
      :root {
        --container-max: 1000px;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }

      /* Box color themes */
      .redBackground {
        background-color: #ffccb;
        border: 1px solid #dc3545;
      }
      .redBackground h2 {
        border-color: #dc3545;
        color: ##dc3545;
      }

      .pinkBackground {
        background-color: #f7f3f3;
        border: 1px solid #c3b1d7;
      }
      .pinkBackground h2 {
        border-color: #6a1b9a;
        color: #6a1b9a;
      }

      .yellowBackground {
        background-color: #fff9e6;
        border: 1px solid #e0c88a;
      }
      .yellowBackground h2 {
        border-color: #d8a700;
        color: #d8a700;
      }

      .greenBackground {
        background-color: #e6f9f9;
        border: 1px solid #a8c8c8;
      }
      .greenBackground h2 {
        border-color: #008080;
        color: #008080;
      }

      /* Entry content layout */
      .entry-content {
        display: block;
      }
      .entry-content::after {
        content: "";
        display: table;
        clear: both;
      }

      .entry-image,
      .entry-imageVertical {
        text-align: center;
        margin-bottom: 1rem;
      }
      .entry-image img {
        width: 100%;
        max-width: 520px;
        aspect-ratio: 350 / 230;
        object-fit: cover;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        margin-inline: auto;
      }
      .entry-image p {
        font-size: 0.9rem;
        color: #666;
        margin-top: 0.5rem;
      }

      .entry-imageVertical img {
        width: 100%;
        max-width: 320px;
        aspect-ratio: 280 / 380;
        object-fit: cover;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        margin-inline: auto;
      }

      @media (min-width: 768px) {
        /* Float images on larger screens, text wraps nicely */
        .entry-image,
        .entry-imageVertical {
          float: left;
          margin: 0 2rem 1rem 0;
        }
      }

      /* LIGHTBOX overlay */
      .lightbox-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.92);
        display: none; /* toggled to flex */
        align-items: center;
        justify-content: center;
        z-index: 9999;
        cursor: zoom-out; /* indicates click to close */
        padding: 2vh 2vw;
      }
      .lightbox-backdrop.is-open {
        display: flex;
      }

      .lightbox-content {
        max-width: 96vw;
        max-height: 96vh;
        width: auto;
        height: auto;
        display: block;
        object-fit: contain; /* Fit within screen, preserve aspect ratio */
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        border-radius: 8px;
        pointer-events: none; /* clicking the image still closes the overlay */
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="container">
        <div class="banner-inner">
          <div class="banner-left">
            <div id="timer"></div>
            <p class="event-date">Lørdag 20. Desember</p>
            <p class="event-location">Mosvatnet 10:30</p>
          </div>

          <div class="banner-center">
            <h1>Legendeløpet 2025</h1>
            <p>Historie</p>
          </div>

          <div class="banner-right">
            <a href="results.html" class="btn">Resultater</a>
            <a href="index.html" class="btn">← Tilbake til forsiden</a>
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <main></main>
    </div>

    <div id="footer">
      <footer>Legendeløpet</footer>
    </div>

    <!-- LIGHTBOX markup -->
    <div class="lightbox-backdrop" id="lightbox" aria-hidden="true">
      <img class="lightbox-content" id="lightbox-img" alt="Forstørret bilde" />
    </div>

    <script>
      // Nedtelling for Legendeløpet 2025
      (function countdownInit() {
        const targetDate = new Date("2025-12-20T10:30:00");
        const timerElement = document.getElementById("timer");
        function tick() {
          const now = new Date();
          const diff = targetDate - now;
          if (diff <= 0) {
            timerElement.textContent = "Løpet har startet!";
            return;
          }
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
          const minutes = Math.floor((diff / (1000 * 60)) % 60);
          const seconds = Math.floor((diff / 1000) % 60);
          timerElement.textContent = `${days} dager ${hours}t ${minutes}m ${seconds}s`;
        }
        tick();
        setInterval(tick, 1000);
      })();

      // Lightweight Lightbox: applies to ALL images
      (function lightboxInit() {
        const lb = document.getElementById("lightbox");
        const lbImg = document.getElementById("lightbox-img");

        function openLightbox(src, alt) {
          lbImg.src = src;
          lbImg.alt = alt || "Forstørret bilde";
          lb.classList.add("is-open");
          lb.setAttribute("aria-hidden", "false");
          document.documentElement.style.overflow = "hidden"; // Prevent background scroll
        }

        function closeLightbox() {
          lb.classList.remove("is-open");
          lb.setAttribute("aria-hidden", "true");
          lbImg.removeAttribute("src");
          document.documentElement.style.overflow = "";
        }

        // Click ANYWHERE to close
        lb.addEventListener("click", closeLightbox);
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeLightbox();
        });

        // Delegate clicks to all <img>
        document.addEventListener(
          "click",
          (e) => {
            const t = e.target;
            if (t && t.tagName === "IMG" && !lb.contains(t)) {
              // If image has srcset/sizes, prefer currentSrc
              const src = t.currentSrc || t.src;
              openLightbox(src, t.alt || "");
            }
          },
          true,
        );
      })();
    </script>
  </body>
</html>
